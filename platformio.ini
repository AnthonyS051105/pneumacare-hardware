; PNEUMACARE firmware — PlatformIO
;
;   pio run                          -> build firmware produksi (env pneumacare)
;   pio run -t upload                -> upload firmware produksi
;   pio run -e diag_mic -t upload    -> upload program diagnostik tertentu
;   pio device monitor               -> serial monitor (115200)
;   pio test -e native               -> unit test logika murni di PC (tanpa board)
;
; Daftar lengkap program diagnostik & test per fase: lihat docs/TESTING_GUIDE.md.
;
; ⚠️ board = esp32doit-devkit-v1 masih placeholder generik ESP32 classic
; (WROOM-32, 4 MB flash). Ganti sesuai board aktual dari PIN_MAPPING_BOM.md §1.

[platformio]
default_envs = pneumacare

; ---------------------------------------------------------------------
; Basis bersama semua env ESP32. Versi platform & library di-pin supaya build
; reproducible (versi yang sudah teruji build di repo ini).
; ---------------------------------------------------------------------
[esp32_base]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wno-missing-field-initializers
    ; Default library 5 s: tiap percobaan connect websocket yang gagal memblokir
    ; task network selama itu. 2 s cukup untuk backend di LAN yang sama.
    -DWEBSOCKETS_TCP_TIMEOUT=2000
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3

; ---------------------------------------------------------------------
; Firmware produksi (Fase 4 — integrasi penuh)
; ---------------------------------------------------------------------
[env:pneumacare]
extends = esp32_base
build_src_filter = +<*> -<diag/>

; ---------------------------------------------------------------------
; Diagnostik per komponen (troubleshooting hardware satu per satu)
; ---------------------------------------------------------------------
[env:diag_i2c_scan]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_i2c_scan.cpp>

[env:diag_mic]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_mic.cpp> +<audio_acquisition.cpp> +<noise_filter.cpp>
    +<audio_pcm.cpp> +<channel_health.cpp>

[env:diag_ppg]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_ppg.cpp> +<ppg_acquisition.cpp>

[env:diag_battery]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_battery.cpp> +<battery_curve.cpp>

[env:diag_led]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_led.cpp> +<status_led.cpp>

[env:diag_wifi]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_wifi.cpp> +<network_manager.cpp> +<reconnect_manager.cpp>

[env:diag_ws]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_ws.cpp> +<network_manager.cpp> +<reconnect_manager.cpp>
    +<audio_frame.cpp>

[env:diag_mqtt]
extends = esp32_base
build_src_filter = -<*> +<diag/diag_mqtt.cpp> +<network_manager.cpp> +<reconnect_manager.cpp>
    +<ppg_payload.cpp>

; ---------------------------------------------------------------------
; Test per fase pengembangan (TASK_BREAKDOWN_HARDWARE.md). Bila firmware
; produksi bermasalah, jalankan berurutan untuk menemukan fase yang gagal.
; Fase 4 = env pneumacare itu sendiri.
; ---------------------------------------------------------------------
[env:phase1_acquisition]
extends = esp32_base
build_src_filter = -<*> +<diag/phase1_acquisition.cpp> +<audio_acquisition.cpp>
    +<ppg_acquisition.cpp> +<channel_health.cpp>

[env:phase2_filter_buffer]
extends = esp32_base
build_src_filter = -<*> +<diag/phase2_filter_buffer.cpp> +<audio_pipeline.cpp>
    +<audio_acquisition.cpp> +<noise_filter.cpp> +<audio_pcm.cpp> +<channel_health.cpp>
    +<buffer_manager.cpp>

[env:phase3_network]
extends = esp32_base
build_src_filter = -<*> +<diag/phase3_network.cpp> +<network_manager.cpp>
    +<reconnect_manager.cpp> +<ws_client.cpp> +<mqtt_client.cpp> +<audio_frame.cpp>
    +<ppg_payload.cpp> +<buffer_manager.cpp>

; ---------------------------------------------------------------------
; Unit test logika murni di PC (tanpa ESP32): ring buffer, filter, konversi
; PCM, format pesan websocket & MQTT, backoff, kurva baterai, health channel.
; ---------------------------------------------------------------------
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<buffer_manager.cpp> +<noise_filter.cpp> +<audio_pcm.cpp>
    +<channel_health.cpp> +<audio_frame.cpp> +<ppg_payload.cpp> +<reconnect_manager.cpp>
    +<battery_curve.cpp>
build_flags = -std=gnu++17 -Wall -Iinclude
lib_deps =
    bblanchon/ArduinoJson@7.4.3
